TebLocalPlannerROS:

  # =========================
  # 基础话题与坐标系
  # =========================
  odom_topic: /ranger_base_node/odom

  # 局部代价地图工作在 odom 坐标系
  map_frame: odom

  # =========================
  # 轨迹离散参数
  # =========================
  teb_autosize: true
  dt_ref: 0.30
  dt_hysteresis: 0.10

  min_samples: 5
  max_samples: 500

  global_plan_overwrite_orientation: false
  allow_init_with_backwards_motion: false

  global_plan_viapoint_sep: 0.80
  via_points_ordered: false

  max_global_plan_lookahead_dist: 2.0
  global_plan_prune_distance: 1.0

  exact_arc_length: false
  feasibility_check_no_poses: 5
  publish_feedback: false

  # =========================
  # Ranger 速度限制
  # =========================
  max_vel_x: 0.45
  max_vel_x_backwards: 0.05
  max_vel_y: 0.0
  max_vel_trans: 0.25

  # 这里仍是车体偏航角速度，不是舵角
  max_vel_theta: 0.30

  acc_lim_x: 0.50
  acc_lim_y: 0.0
  acc_lim_theta: 0.40

  # 初始测试值，不是 Ranger 官方机械参数
  # 后续根据实际转弯效果微调
  min_turning_radius: 0.0

  # Ranger 驱动接收 Twist.angular.z 角速度
  cmd_angle_instead_rotvel: false

  # cmd_angle_instead_rotvel=false 时不使用该值
  wheelbase: 0.50

  use_proportional_saturation: true
  transform_tolerance: 0.50

  # =========================
  # 到达目标判定
  # =========================
  xy_goal_tolerance: 0.25
  yaw_goal_tolerance: 0.60
  free_goal_vel: false

  trans_stopped_vel: 0.03
  theta_stopped_vel: 0.03
  complete_global_plan: true

  # =========================
  # 障碍物参数
  # 当前仍使用代价地图中的静态障碍物
  # =========================
  min_obstacle_dist: 0.10
  inflation_dist: 0.25
  dynamic_obstacle_inflation_dist: 0.30

  include_dynamic_obstacles: false
  include_costmap_obstacles: true

  costmap_obstacles_behind_robot_dist: 1.0
  obstacle_poses_affected: 20

  legacy_obstacle_association: false
  obstacle_association_force_inclusion_factor: 1.5
  obstacle_association_cutoff_factor: 5.0

  costmap_converter_plugin: ""
  costmap_converter_spin_thread: true
  costmap_converter_rate: 5

  # =========================
  # 机器人轮廓
  # 与 global/local costmap 保持一致
  # =========================
  footprint_model:
    type: polygon
    vertices:
      - [ 0.45,  0.32]
      - [ 0.45, -0.32]
      - [-0.45, -0.32]
      - [-0.45,  0.32]

  # =========================
  # 优化器
  # =========================
  no_inner_iterations: 5
  no_outer_iterations: 4

  optimization_activate: true
  optimization_verbose: false

  penalty_epsilon: 0.01
  obstacle_cost_exponent: 1.0

  weight_max_vel_x: 2.0
  weight_max_vel_y: 2.0
  weight_max_vel_theta: 1.0

  weight_acc_lim_x: 1.0
  weight_acc_lim_y: 1.0
  weight_acc_lim_theta: 1.0

  # 强制保持非完整、优先前进和转弯半径约束
  weight_kinematics_nh: 1000.0
  weight_kinematics_forward_drive: 1000.0
  weight_kinematics_turning_radius: 1.0

  weight_optimaltime: 5.0
  weight_shortest_path: 0.0

  weight_obstacle: 50.0
  weight_inflation: 0.10
  weight_dynamic_obstacle: 10.0
  weight_dynamic_obstacle_inflation: 0.10
  weight_viapoint: 20.0

  weight_adapt_factor: 2.0

  # =========================
  # 初次测试只优化一条轨迹
  # 避免同时搜索多条拓扑路径
  # =========================
  enable_homotopy_class_planning: false
  enable_multithreading: true
  max_number_classes: 2

  # =========================
  # TEB 内部恢复
  # =========================
  shrink_horizon_backup: true
  shrink_horizon_min_duration: 10.0

  # 初次测试先关闭内部振荡恢复
  oscillation_recovery: false
