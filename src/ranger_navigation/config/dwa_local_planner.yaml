DWAPlannerROS:
  odom_topic: /ranger_base_node/odom

  max_vel_x: 0.12
  min_vel_x: 0.06

  max_vel_y: 0.0
  min_vel_y: 0.0

  max_vel_trans: 0.12
  min_vel_trans: 0.06

  max_vel_theta: 0.12
  min_vel_theta: 0.0

  acc_lim_x: 0.80
  acc_lim_y: 0.00
  acc_lim_theta: 1.00

  holonomic_robot: false
  penalize_negative_x: true

  xy_goal_tolerance: 0.20
  yaw_goal_tolerance: 0.35
  latch_xy_goal_tolerance: true

  trans_stopped_vel: 0.03
  theta_stopped_vel: 0.02

  sim_time: 1.0
  sim_granularity: 0.05
  angular_sim_granularity: 0.025

  vx_samples: 20
  vy_samples: 1
  vtheta_samples: 40

  path_distance_bias: 40.0
  goal_distance_bias: 16.0
  occdist_scale: 0.05

  forward_point_distance: 0.20
  stop_time_buffer: 0.20

  scaling_speed: 0.10
  max_scaling_factor: 0.20

  publish_traj_pc: true
  publish_cost_grid_pc: true